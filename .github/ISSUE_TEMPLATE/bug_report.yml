name: Bug report
description: Report a reproducible problem in LouisMahdi System Inspector
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Remove usernames, serial numbers, UUIDs, MAC addresses, IP addresses, Wi-Fi names, domain details, and other identifiers before submitting anything publicly.

  - type: input
    id: version
    attributes:
      label: Application version
      description: The version shown in the application or report.
      placeholder: 2.2.0
    validations:
      required: true

  - type: dropdown
    id: launch
    attributes:
      label: Launch method
      options:
        - Released EXE
        - Run_Source.bat
        - Direct PowerShell execution
        - Command-line mode
        - Builder or launcher self-test
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 25H2, x64
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Report mode
      options:
        - Standard
        - Extended with privacy enabled
        - Extended with privacy disabled
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the application
        2. Select Standard mode
        3. Generate the report
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: sanitized-output
    attributes:
      label: Sanitized error output
      description: Paste only output that has been checked for personal or device identifiers.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal, network, device, and organization identifiers from this report.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
