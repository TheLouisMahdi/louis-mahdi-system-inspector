<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LouisMahdi System Inspector</title>
  <desc id="desc">Animated black and green project banner for a privacy-first Windows system inventory tool developed by LouisMahdi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="45%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#07110b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="35%" stop-color="#2ea043"/>
      <stop offset="55%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#0d1117"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#39d353" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame"><rect x="16" y="16" width="1168" height="388" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <g clip-path="url(#frame)">
    <circle cx="950" cy="90" r="170" fill="#238636" opacity="0.14" filter="url(#soft)">
      <animate attributeName="r" values="145;185;145" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="355" r="150" fill="#39d353" opacity="0.10" filter="url(#soft)">
      <animate attributeName="cx" values="170;245;170" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="0" y="-80" width="1200" height="70" fill="#39d353" opacity="0.05">
      <animate attributeName="y" values="-80;430" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="16" y="16" width="1168" height="388" rx="24" fill="none" stroke="#2ea043" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="364" rx="18" fill="none" stroke="#7ee787" stroke-opacity="0.15"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(58 54)">
      <rect width="126" height="32" rx="16" fill="#161b22" stroke="#2ea043"/>
      <text x="63" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee787">WINDOWS</text>
      <rect x="138" width="146" height="32" rx="16" fill="#161b22" stroke="#2ea043"/>
      <text x="211" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee787">POWERSHELL</text>
      <rect x="296" width="86" height="32" rx="16" fill="#161b22" stroke="#2ea043"/>
      <text x="339" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee787">C#</text>
      <rect x="394" width="110" height="32" rx="16" fill="#161b22" stroke="#2ea043"/>
      <text x="449" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee787">WINFORMS</text>
    </g>

    <text x="58" y="154" font-size="58" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">LouisMahdi</text>
    <text x="58" y="216" font-size="58" font-weight="800" fill="#39d353" filter="url(#glow)" letter-spacing="-1.5">System Inspector</text>
    <rect x="58" y="236" width="640" height="3" rx="1.5" fill="url(#line)"/>

    <text x="58" y="282" font-size="22" fill="#c9d1d9">Privacy-first · Read-only · Offline Windows inventory</text>
    <text x="58" y="316" font-size="17" fill="#8b949e">Accurate hardware, firmware, OS, storage, display, battery and network reports.</text>
    <text x="58" y="355" font-size="17" font-weight="700" fill="#7ee787">Developed by LouisMahdi</text>

    <g transform="translate(794 128)" font-family="Consolas, JetBrains Mono, monospace">
      <rect width="330" height="190" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <circle cx="22" cy="20" r="5" fill="#ff7b72"/>
      <circle cx="40" cy="20" r="5" fill="#d29922"/>
      <circle cx="58" cy="20" r="5" fill="#3fb950"/>
      <text x="22" y="58" font-size="15" fill="#7ee787">$ inspector --standard</text>
      <g font-size="14">
        <text x="22" y="90" fill="#8b949e">collecting hardware...</text>
        <text x="22" y="90" fill="#8b949e" opacity="0">
          validating sources...
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.36;0.62;0.68" dur="6s" repeatCount="indefinite"/>
        </text>
        <text x="22" y="90" fill="#8b949e" opacity="0">
          exporting reports...
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.94;1" dur="6s" repeatCount="indefinite"/>
        </text>
      </g>
      <text x="22" y="124" font-size="14" fill="#3fb950">✓ TXT  ✓ JSON  ✓ HTML</text>
      <text x="22" y="154" font-size="14" fill="#58a6ff">privacy mode: enabled</text>
      <rect x="22" y="169" width="9" height="15" fill="#39d353">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g fill="none" stroke="#39d353" stroke-width="2" opacity="0.75">
    <circle cx="1135" cy="70" r="7">
      <animate attributeName="r" values="5;12;5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="755" cy="360" r="5">
      <animate attributeName="r" values="4;10;4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
